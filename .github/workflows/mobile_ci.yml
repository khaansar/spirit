name: ClearIt Mobile CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  validate:
    name: Verify & Validate App
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate Expo App Configuration
        run: npx expo config --type public

      - name: Validate Project Structure & Manifests
        run: |
          test -f app.json && echo "app.json is valid"
          test -f package.json && echo "package.json is valid"
          test -f babel.config.js && echo "babel.config.js is valid"
          test -f App.js && echo "App.js is present"
          test -d src/navigation && echo "Navigation is present"
          test -d src/store && echo "Redux store is present"
          test -d src/screens && echo "Screens are present"
